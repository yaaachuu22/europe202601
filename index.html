<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1a1a1a;background:#f5f5f0;padding:1rem 1rem 3rem;max-width:680px;margin:0 auto}
h2{font-size:18px;font-weight:600;margin-bottom:1.25rem}
input,select,button{font-family:inherit}
.tabs{display:flex;gap:6px;margin-bottom:1.25rem;flex-wrap:wrap}
.tab{border:1px solid #ddd;border-radius:8px;padding:6px 14px;font-size:13px;background:#fff;color:#666;cursor:pointer}
.tab.active{border:2px solid #534AB7;color:#534AB7;font-weight:600}
.pass-section{margin-bottom:1rem}
.pass-title{font-size:13px;font-weight:600;color:#444;margin-bottom:6px}
.pass-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-bottom:6px}
.pass-card{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:.6rem .75rem}
.pass-name{font-size:12px;font-weight:600;margin-bottom:2px}
.pass-price{font-size:15px;font-weight:700;color:#534AB7;margin-bottom:2px}
.pass-desc{font-size:11px;color:#888;line-height:1.4;margin-bottom:4px}
.pass-link{font-size:11px;padding:3px 8px;border-radius:20px;background:#EEEDFE;color:#534AB7;border:1px solid #AFA9EC;text-decoration:none;display:inline-block}
.train-card{border:1px solid #B5D4F4;border-radius:12px;background:#E6F1FB;padding:.85rem 1rem;margin-bottom:1rem}
.train-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:.5rem}
.train-title{font-size:14px;font-weight:600;color:#0C447C}
.train-price{font-size:13px;font-weight:700;color:#185FA5;background:#fff;border-radius:6px;padding:2px 8px;border:1px solid #B5D4F4}
.train-sub{font-size:12px;color:#185FA5;margin-bottom:6px}
.tlinks{display:flex;gap:6px;flex-wrap:wrap}
.tlink{font-size:12px;padding:4px 10px;border-radius:20px;background:#fff;border:1px solid #85B7EB;color:#185FA5;text-decoration:none}
.flight-card{border:1px solid #C0DD97;border-radius:12px;background:#EAF3DE;padding:.85rem 1rem;margin-bottom:1rem}
.flight-title{font-size:14px;font-weight:600;color:#3B6D11;margin-bottom:.4rem}
.flight-row{font-size:12px;color:#3B6D11;margin-bottom:2px}
.warn-card{border:1px solid #FAC775;border-radius:12px;background:#FAEEDA;padding:.75rem 1rem;margin-bottom:1rem;font-size:13px;color:#633806}
.city-header{display:flex;align-items:center;gap:10px;margin-bottom:1rem;flex-wrap:wrap}
.city-flag{font-size:22px}.city-name{font-size:17px;font-weight:600}
.city-meta{font-size:12px;color:#888;margin-left:auto;text-align:right}
.day-block{border:1px solid #e0e0e0;border-radius:12px;margin-bottom:.65rem;background:#fff}
.day-header{display:flex;align-items:center;gap:8px;padding:.6rem 1rem;background:#f8f8f6;border-bottom:1px solid #e0e0e0;border-radius:12px 12px 0 0}
.day-label{font-size:13px;font-weight:600;min-width:50px}
.day-date{font-size:12px;color:#888}
.day-badge{font-size:10px;padding:2px 7px;border-radius:10px;margin-left:4px}
.badge-arrive{background:#E1F5EE;color:#085041}
.badge-return{background:#FAECE7;color:#4A1B0C}
.activities-wrap{padding:.65rem 1rem}
.time-slot{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.time-input{width:72px;border:1px solid #ddd;border-radius:8px;padding:4px 5px;font-size:12px;background:#fff;text-align:center}
.act-main{flex:1;min-width:0}
.act-row1{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.act-text{font-size:13px;color:#1a1a1a;line-height:1.4}
.act-links{display:flex;gap:5px;margin-top:3px;flex-wrap:wrap}
.act-link{font-size:11px;padding:2px 8px;border-radius:20px;text-decoration:none;white-space:nowrap}
.map-link{background:#E6F1FB;color:#185FA5;border:1px solid #B5D4F4}
.ticket-link{background:#EAF3DE;color:#3B6D11;border:1px solid #C0DD97}
.cat-badge{font-size:11px;padding:2px 7px;border-radius:20px;font-weight:600;margin-right:2px;display:inline-block;white-space:nowrap}
.cat-sight{background:#E1F5EE;color:#085041}
.cat-food{background:#EEEDFE;color:#3C3489}
.cat-adv{background:#FAECE7;color:#4A1B0C}
.cat-shop{background:#FAEEDA;color:#633806}
.cat-night{background:#FBEAF0;color:#4B1528}
.cat-dance{background:#EEEDFE;color:#26215C}
.cat-transport{background:#E6F1FB;color:#0C447C}
.fixed-badge{font-size:10px;padding:1px 5px;border-radius:10px;background:#e0e0e0;color:#666;margin-left:3px;vertical-align:middle}
.del-btn{border:none;background:transparent;cursor:pointer;color:#ccc;font-size:16px;padding:0 2px;flex-shrink:0;margin-top:1px}
.add-section{margin-top:.75rem;border-top:1px solid #f0f0f0;padding-top:.65rem}
.add-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:5px}
.add-row input,.add-row select{border:1px solid #ddd;border-radius:8px;padding:6px 8px;font-size:12px;background:#fff;color:#1a1a1a}
.add-row input.tf{width:72px;text-align:center}
.add-row input.af{flex:1;min-width:100px}
.add-row input.lf{flex:1;min-width:100px;font-size:11px}
.add-row button{border:1px solid #ccc;border-radius:8px;padding:6px 12px;font-size:12px;background:#fff;cursor:pointer}
.empty-hint{font-size:12px;color:#aaa;padding:.2rem 0}
.save-bar{display:flex;align-items:center;gap:8px;margin-bottom:1rem;font-size:12px;color:#888;background:#fff;border-radius:8px;padding:.5rem .75rem;border:1px solid #e0e0e0}
.save-dot{width:7px;height:7px;border-radius:50%;background:#1D9E75;flex-shrink:0}
.reset-btn{margin-left:auto;border:1px solid #ddd;border-radius:8px;padding:3px 10px;font-size:12px;background:#fff;color:#888;cursor:pointer}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:1rem}
.metric{background:#fff;border-radius:8px;padding:.65rem .85rem;border:1px solid #e0e0e0}
.metric-label{font-size:11px;color:#888;margin-bottom:3px}
.metric-val{font-size:20px;font-weight:600}
.prog-bar{height:7px;border-radius:4px;background:#eee;overflow:hidden;margin-bottom:5px}
.prog-fill{height:100%;border-radius:4px}
</style>

    {activities:[{time:'',text:'Celia Darling Vintage — 第9區，飾品CP值最高',cat:'shop',fixed:false,mapQuery:'Celia Darling Vintage Paris',ticketUrl:''}]},
    {activities:[]},
    {activities:[]},
    {activities:[]},
    {activities:[
      {time:'11:00',text:'出發前往戴高樂機場 (RER B)',cat:'transport',fixed:true,mapQuery:'Paris Charles de Gaulle Airport',ticketUrl:''},
      {time:'14:40',text:'KE5902 起飛 → 首爾仁川',cat:'transport',fixed:true,mapQuery:'',ticketUrl:''},
    ]},
  ],
};

let budget={limit:0,expenses:[]};
let active='ams';

function resetAll(){if(!confirm('確定要重置嗎？'))return;location.reload();}
function renderTabs(){
  document.getElementById('tabs').innerHTML=CITIES.map(c=>`
    <button class="tab ${c.id===active?'active':''}" onclick="sw('${c.id}')">${c.flag}${c.name}</button>`).join('');
}
function sw(id){active=id;renderTabs();renderSec();}
function catInfo(val){return CATS.find(c=>c.val===val)||CATS[0];}

function renderTransitSection(key){
  const t=TRANSIT[key];if(!t)return'';
  const cards=t.passes.map(p=>`<div class="pass-card"><div class="pass-name">${p.name}</div><div class="pass-price">${p.price}</div><div class="pass-desc">${p.desc}</div><a class="pass-link" href="${p.url}" target="_blank">了解更多 ↗</a></div>`).join('');
  return `<div class="pass-section"><div class="pass-title">🚌 交通票券建議</div><div class="pass-grid">${cards}</div><div class="warn-card" style="font-size:12px">${t.tip}</div></div>`;
}
function renderTrainCard(idx){
  const r=TRAIN_ROUTES[idx];if(r===undefined)return'';
  const lks=r.links.map(l=>`<a class="tlink" href="${l.url}" target="_blank">${l.label} ↗</a>`).join('');
  return `<div class="train-card"><div class="train-header"><span class="train-title">🚂 ${r.from} → ${r.to}　約 ${r.duration}</span><span class="train-price">約 ${r.price}</span></div><div class="train-sub">⚠️ 票尚未購買 — ${r.priceNote}</div><div class="tlinks">${lks}</div></div>`;
}

function renderSec(){
  const sec=document.getElementById('sections');
  if(active==='budget'){sec.innerHTML=buildBudget();return;}
  if(active==='summary'){sec.innerHTML=buildSummary();return;}
  const city=CITIES.find(c=>c.id===active);
  let h='';
  if(city.flightIn){h+=`<div class="flight-card"><div class="flight-title">${city.flightIn.title}</div>${city.flightIn.rows.map(r=>`<div class="flight-row">• ${r}</div>`).join('')}</div>`;}
  if(city.airportWarn){
    const lks=city.airportLinks.map(l=>`<a class="tlink" href="${l.url}" target="_blank">${l.label} ↗</a>`).join('');
    h+=`<div class="warn-card">${city.airportWarn}<div class="tlinks" style="margin-top:6px">${lks}</div></div>`;
  }
  if(city.trainIdx!==undefined)h+=renderTrainCard(city.trainIdx);
  if(city.transit)h+=renderTransitSection(city.transit);
  const endDate=fmt(addDays(new Date(city.start),city.days-1));
  h+=`<div class="city-header"><span class="city-flag">${city.flag}</span><span class="city-name">${city.name}</span><div class="city-meta">${fmt(new Date(city.start))} – ${endDate}<br>${city.meta||''}</div></div>`;
  for(let i=0;i<city.days;i++){
    const d=addDays(new Date(city.start),i);
    const badge=city.dayBadges?.[i];
    const badgeHtml=badge?`<span class="day-badge badge-${badge}">${badge==='arrive'?'抵達日':'回程日 ✈️'}</span>`:'';
    const acts=(state[city.id]?.[i]?.activities)||[];
    const actsHtml=acts.length?acts.map((a,j)=>{
      const cat=catInfo(a.cat);
      const mq=a.mapQuery||a.text;
      const mapBtn=mq?`<a class="act-link map-link" href="${mapUrl(mq)}" target="_blank">📍 地圖</a>`:'';
      const ticketBtn=a.ticketUrl?`<a class="act-link ticket-link" href="${a.ticketUrl}" target="_blank">🎟 購票</a>`:'';
      return `<div class="time-slot">
        <input class="time-input" type="time" value="${a.time||''}" onchange="upTime('${city.id}',${i},${j},this.value)"/>
        <div class="act-main">
          <div class="act-row1"><span class="cat-badge ${cat.cls}">${cat.label}</span><span class="act-text">${a.text}</span>${a.fixed?'<span class="fixed-badge">固定</span>':''}</div>
          <div class="act-links">${mapBtn}${ticketBtn}</div>
        </div>
        ${a.fixed?'<span style="width:18px"></span>':`<button class="del-btn" onclick="delAct('${city.id}',${i},${j})">✕</button>`}
      </div>`;
    }).join(''):'<p class="empty-hint">尚未新增活動</p>';
    const catOpts=CATS.map(c=>`<option value="${c.val}">${c.label}</option>`).join('');
    h+=`<div class="day-block">
      <div class="day-header"><span class="day-label">第 ${i+1} 天</span><span class="day-date">${fmt(d)}</span>${badgeHtml}</div>
      <div class="activities-wrap">
        ${actsHtml}
        <div class="add-section">
          <div class="add-row">
            <input class="tf" id="t-${city.id}-${i}" type="time"/>
            <input class="af" id="a-${city.id}-${i}" placeholder="地點或活動名稱…"/>
            <select id="c-${city.id}-${i}">${catOpts}</select>
          </div>
          <div class="add-row">
            <input class="lf" id="tk-${city.id}-${i}" placeholder="購票網址（選填）"/>
            <button onclick="addAct('${city.id}',${i})">新增</button>
          </div>
        </div>
      </div>
    </div>`;
  }
  if(city.flightOut){
    h+=`<div class="flight-card" style="margin-top:.75rem"><div class="flight-title">${city.flightOut.title}</div>${city.flightOut.rows.map(r=>`<div class="flight-row">• ${r}</div>`).join('')}</div>`;
    h+=`<div class="warn-card">${city.returnWarn}</div>`;
  }
  sec.innerHTML=h;
}

function addAct(cid,di){
  const t=document.getElementById(`t-${cid}-${di}`).value;
  const a=document.getElementById(`a-${cid}-${di}`).value.trim();
  const c=document.getElementById(`c-${cid}-${di}`).value;
  const tk=document.getElementById(`tk-${cid}-${di}`).value.trim();
  if(!a)return;
  if(!state[cid][di])state[cid][di]={activities:[]};
  state[cid][di].activities.push({time:t,text:a,cat:c,fixed:false,mapQuery:a,ticketUrl:tk});
  state[cid][di].activities.sort((x,y)=>(x.time||'99:99').localeCompare(y.time||'99:99'));
  renderSec();
}
function delAct(cid,di,ai){state[cid][di].activities.splice(ai,1);renderSec();}
function upTime(cid,di,ai,v){
  state[cid][di].activities[ai].time=v;
  state[cid][di].activities.sort((x,y)=>(x.time||'99:99').localeCompare(y.time||'99:99'));
  renderSec();
}

function buildBudget(){
  const total=budget.expenses.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const limit=parseFloat(budget.limit)||0;
  const remain=limit-total;
  const pct=limit?Math.min(100,Math.round(total/limit*100)):0;
  const barColor=pct>=90?'#E24B4A':pct>=70?'#BA7517':'#1D9E75';
  const byCat={};
  budget.expenses.forEach(e=>{byCat[e.cat]=(byCat[e.cat]||0)+(parseFloat(e.amount)||0);});
  const catRows=EXP_CATS.map(c=>{const n=byCat[c.val]||0;if(!n)return'';return`<div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid #f0f0f0"><span>${c.label}</span><span style="font-weight:600">€${n.toFixed(2)}</span></div>`;}).join('');
  const expRows=budget.expenses.length?[...budget.expenses].reverse().map((e,ri)=>{
    const i=budget.expenses.length-1-ri;
    const cat=EXP_CATS.find(c=>c.val===e.cat)||EXP_CATS[5];
    return `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f5f5f5">
      <div style="flex:1"><div style="font-size:13px;font-weight:600">${e.desc||'（無備註）'}</div>
      <div style="font-size:11px;color:#aaa">${e.date||''} ${e.city?'· '+e.city:''} · ${cat.label}</div></div>
      <div style="font-size:14px;font-weight:700">€${(parseFloat(e.amount)||0).toFixed(2)}</div>
      <button onclick="delExp(${i})" style="border:none;background:transparent;cursor:pointer;color:#ccc;font-size:16px">✕</button>
    </div>`;
  }).join(''):'<div style="font-size:13px;color:#aaa;padding:.5rem 0">尚未新增任何消費</div>';
  const cityOpts=EXP_CITIES.map(c=>`<option value="${c}">${c}</option>`).join('');
  const catOpts=EXP_CATS.map(c=>`<option value="${c.val}">${c.label}</option>`).join('');
  return `<div style="background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:1rem;margin-bottom:1rem">
    <div style="font-size:14px;font-weight:600;margin-bottom:.75rem">旅程總預算</div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:.75rem">
      <span style="font-size:13px;color:#888">預算上限 €</span>
      <input type="number" id="bl" value="${budget.limit||''}" placeholder="例如 3000" style="width:130px;border:1px solid #ddd;border-radius:8px;padding:5px 8px;font-size:14px" oninput="budget.limit=this.value;renderSec()"/>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:.75rem">
      <div style="background:#f8f8f6;border-radius:8px;padding:.6rem .75rem"><div style="font-size:11px;color:#888;margin-bottom:2px">已花費</div><div style="font-size:18px;font-weight:700;color:#E24B4A">€${total.toFixed(2)}</div></div>
      <div style="background:#f8f8f6;border-radius:8px;padding:.6rem .75rem"><div style="font-size:11px;color:#888;margin-bottom:2px">剩餘</div><div style="font-size:18px;font-weight:700;color:${remain>=0?'#1D9E75':'#E24B4A'}">${limit?'€'+remain.toFixed(2):'—'}</div></div>
      <div style="background:#f8f8f6;border-radius:8px;padding:.6rem .75rem"><div style="font-size:11px;color:#888;margin-bottom:2px">使用率</div><div style="font-size:18px;font-weight:700;color:${barColor}">${limit?pct+'%':'—'}</div></div>
    </div>
    ${limit?`<div style="background:#eee;border-radius:4px;height:8px;overflow:hidden"><div style="height:100%;border-radius:4px;background:${barColor};width:${pct}%"></div></div>`:''}
  </div>
  ${catRows?`<div style="background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:1rem;margin-bottom:1rem"><div style="font-size:14px;font-weight:600;margin-bottom:.5rem">按類別統計</div>${catRows}</div>`:''}
  <div style="background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:1rem;margin-bottom:1rem">
    <div style="font-size:14px;font-weight:600;margin-bottom:.75rem">新增消費</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px">
      <input id="ed" type="date" style="border:1px solid #ddd;border-radius:8px;padding:5px 8px;font-size:13px;flex:1;min-width:130px"/>
      <input id="ea" type="number" placeholder="金額 (EUR)" step="0.01" style="border:1px solid #ddd;border-radius:8px;padding:5px 8px;font-size:13px;flex:1;min-width:100px"/>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px">
      <input id="edesc" placeholder="備註" style="border:1px solid #ddd;border-radius:8px;padding:5px 8px;font-size:13px;flex:2;min-width:150px"/>
      <select id="ecat" style="border:1px solid #ddd;border-radius:8px;padding:5px 6px;font-size:13px;flex:1">${catOpts}</select>
      <select id="ecity" style="border:1px solid #ddd;border-radius:8px;padding:5px 6px;font-size:13px;flex:1">${cityOpts}</select>
    </div>
    <button onclick="addExp()" style="border:1px solid #ccc;border-radius:8px;padding:6px 16px;font-size:13px;background:#fff;cursor:pointer;width:100%">新增消費紀錄</button>
  </div>
  <div style="background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:1rem">
    <div style="font-size:14px;font-weight:600;margin-bottom:.5rem">消費紀錄 <span style="font-size:12px;color:#aaa;font-weight:400">${budget.expenses.length} 筆</span></div>
    ${expRows}
  </div>`;
}
function addExp(){
  const a=document.getElementById('ea').value;
  const desc=document.getElementById('edesc').value.trim();
  const cat=document.getElementById('ecat').value;
  const city=document.getElementById('ecity').value;
  const date=document.getElementById('ed').value;
  if(!a||parseFloat(a)<=0)return;
  budget.expenses.push({amount:parseFloat(a),desc,cat,city,date});
  renderSec();
}
function delExp(i){budget.expenses.splice(i,1);renderSec();}

function buildSummary(){
  let total=0,filled=0,totalDays=0;
  const byCat={};
  CITIES.filter(c=>c.id!=='summary'&&c.id!=='budget').forEach(city=>{
    (state[city.id]||[]).forEach(day=>{
      totalDays++;if(day.activities.length)filled++;
      day.activities.forEach(a=>{total++;byCat[a.cat]=(byCat[a.cat]||0)+1;});
    });
  });
  const pct=totalDays?Math.round(filled/totalDays*100):0;
  const expTotal=budget.expenses.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const bars=CATS.map(cat=>{const n=byCat[cat.val]||0;if(!n)return'';const w=total?Math.round(n/total*100):0;return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:12px;color:#888;min-width:50px">${cat.label}</span><div class="prog-bar" style="flex:1"><div class="prog-fill" style="width:${w}%;background:${CC[cat.val]}"></div></div><span style="font-size:12px;color:#888;min-width:28px">${n} 項</span></div>`;}).join('');
  const cityRows=CITIES.filter(c=>c.id!=='summary'&&c.id!=='budget').map(city=>{
    const acts=(state[city.id]||[]).flatMap(d=>d.activities);
    const preview=acts.slice(0,3).map(a=>{const cat=catInfo(a.cat);return`<div style="font-size:12px;color:#888;margin-bottom:1px">${a.time?a.time+' ':''}<span class="cat-badge ${cat.cls}">${cat.label}</span>${a.text}</div>`;}).join('');
    return `<div style="border:1px solid #e0e0e0;border-radius:12px;padding:.75rem 1rem;margin-bottom:.65rem;background:#fff"><div style="font-size:14px;font-weight:600;margin-bottom:.4rem">${city.flag}${city.name} <span style="font-size:12px;color:#888;font-weight:400">— ${acts.length} 項 / ${city.days} 天</span></div>${preview||'<div style="font-size:12px;color:#aaa">尚未規劃</div>'}${acts.length>3?`<div style="font-size:11px;color:#aaa;margin-top:2px">…還有 ${acts.length-3} 項</div>`:''}</div>`;
  }).join('');
  return `<div class="summary-grid">
    <div class="metric"><div class="metric-label">旅行總天數</div><div class="metric-val">30</div></div>
    <div class="metric"><div class="metric-label">已規劃天數</div><div class="metric-val">${filled}</div></div>
    <div class="metric"><div class="metric-label">活動總數</div><div class="metric-val">${total}</div></div>
    <div class="metric"><div class="metric-label">規劃進度</div><div class="metric-val">${pct}%</div></div>
    <div class="metric"><div class="metric-label">已記帳</div><div class="metric-val" style="font-size:16px">€${expTotal.toFixed(2)}</div></div>
  </div>
  <div style="margin-bottom:1.25rem">${bars}</div>
  <h3 style="margin-bottom:.75rem;font-size:15px;font-weight:600">各城市概覽</h3>${cityRows}`;
}

renderTabs();renderSec();
</script>
</body>
</html>
