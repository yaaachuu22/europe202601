function getDPR(){
  const pendingTotal=pending.reduce((s,e)=>s+(e.amount||0),0);
  const paid=budget.expenses.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const limit=parseFloat(budget.limit)||0;
  const remain=limit-paid-pendingTotal;
  const tripStart=new Date('2026-06-22');
  const tripEnd=new Date('2026-07-22');
  const today=new Date();
  const totalTripDays=31;
  const daysLeft=today<tripStart?totalTripDays:today>tripEnd?1:Math.max(1,Math.ceil((tripEnd-today)/(1000*60*60*24)));
  return remain>0?remain/daysLeft:0;
}

function addAct(cid,di){
  const t=document.getElementById(`t-${cid}-${di}`).value;
  const a=document.getElementById(`a-${cid}-${di}`).value.trim();
  const c=document.getElementById(`c-${cid}-${di}`).value;
  const tk=document.getElementById(`tk-${cid}-${di}`).value.trim();
  const gm=document.getElementById(`gm-${cid}-${di}`).value.trim();
  const pdf=document.getElementById(`pdf-${cid}-${di}`).value.trim();
  if(!a)return;
  if(!state[cid][di])state[cid][di]={activities:[]};
  state[cid][di].activities.push({time:t,text:a,cat:c,fixed:false,mapQuery:gm?'':a,mapUrl:gm,ticketUrl:tk,pdfUrl:pdf});
  state[cid][di].activities.sort((x,y)=>(x.time||'99:99').localeCompare(y.time||'99:99'));
  renderSec();
}
function delAct(cid,di,ai){state[cid][di].activities.splice(ai,1);renderSec();}
function upTime(cid,di,ai,v){

}

  const barColor=pct>=90?'#E24B4A':pct>=70?'#BA7517':'#1D9E75';

function buildSummary(){

  </div>

  <h3 style="margin-bottom:.75rem;font-size:15px;font-weight:600">各城市概覽</h3>${cityRows}`;

// ── PDF 票券附件 ──────────────────────────────────────────────
// 兩種來源：(1) a.pdfUrl 相對路徑/網址（隨 GitHub 部署，可跨裝置）
//          (2) 本機 IndexedDB 上傳的 PDF（僅該瀏覽器）
let _pdfReg=[];
let _pdfDB=null;
function pdfDB(){
  return new Promise((res,rej)=>{
    if(_pdfDB)return res(_pdfDB);
    if(typeof indexedDB==='undefined')return rej(new Error('no indexedDB'));
    const r=indexedDB.open('trip_pdfs',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('pdfs');
    r.onsuccess=()=>{_pdfDB=r.result;res(_pdfDB);};
    r.onerror=()=>rej(r.error);
  });
}
function pdfHash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return (h>>>0).toString(36);}
function pdfKeyOf(cid,text){return cid+':'+pdfHash(text||'');}
async function pdfGet(key){try{const db=await pdfDB();return await new Promise(res=>{const t=db.transaction('pdfs','readonly').objectStore('pdfs').get(key);t.onsuccess=()=>res(t.result||null);t.onerror=()=>res(null);});}catch(e){return null;}}
async function pdfPut(key,val){const db=await pdfDB();return new Promise((res,rej)=>{const t=db.transaction('pdfs','readwrite').objectStore('pdfs').put(val,key);t.onsuccess=()=>res(true);t.onerror=()=>rej(t.error);});}
async function pdfDel(key){const db=await pdfDB();return new Promise(res=>{const t=db.transaction('pdfs','readwrite').objectStore('pdfs').delete(key);t.onsuccess=()=>res(true);t.onerror=()=>res(false);});}

function attachPDF(ri){
  const r=_pdfReg[ri];if(!r)return;
  const inp=document.createElement('input');
  inp.type='file';inp.accept='application/pdf';
  inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;
    if(f.type!=='application/pdf'&&!f.name.toLowerCase().endsWith('.pdf')){alert('請選擇 PDF 檔案');return;}
    try{await pdfPut(pdfKeyOf(r.cid,r.text),{name:f.name,blob:f});refreshPdfButtons();}
    catch(e){alert('儲存失敗：'+e.message);}
  };
  inp.click();
}
async function openPDF(ri){
  const r=_pdfReg[ri];if(!r)return;
  if(r.url){window.open(r.url,'_blank');return;}
  const rec=await pdfGet(pdfKeyOf(r.cid,r.text));
  if(rec&&rec.blob){const url=URL.createObjectURL(rec.blob);window.open(url,'_blank');setTimeout(()=>URL.revokeObjectURL(url),60000);}
  else alert('找不到附件');
}
async function removePDF(ri){
  const r=_pdfReg[ri];if(!r)return;
  if(!confirm('移除此票券附件？（僅移除本機上傳的檔案）'))return;
  await pdfDel(pdfKeyOf(r.cid,r.text));refreshPdfButtons();
}
async function refreshPdfButtons(){
  for(let ri=0;ri<_pdfReg.length;ri++){
    const r=_pdfReg[ri];
    const el=document.getElementById('pdfslot-'+ri);
    if(!el)continue;
    let has=!!r.url, local=false;
    if(!has){const rec=await pdfGet(pdfKeyOf(r.cid,r.text));if(rec){has=true;local=true;}}
    if(has){
      el.innerHTML=`<a class="act-link pdf-link" onclick="openPDF(${ri})">📄 票券</a>`
        + (local?`<a class="act-link pdf-rm" onclick="removePDF(${ri})">✕</a>`:'');
    } else {
      el.innerHTML=`<a class="act-link pdf-attach" onclick="attachPDF(${ri})">📎 附加票券</a>`;
    }
  }
}

// ── localStorage 持久化 ──────────────────────────────────────
const STORAGE_KEY = 'europe_trip_2026';
// 每次由 Claude 更新 HTML 內建行程時，這個版本號會改變。
// 開啟時若瀏覽器存的版本與此不符，代表 HTML 內容較新 → 以 HTML 為準（捨棄舊的本機暫存）。
const DATA_VERSION = '2026-06-21-rotarrival';

function saveData() {
  try {
    const data = { v: DATA_VERSION, state, budget, pending, active };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    const dot = document.getElementById('save-dot');
    const status = document.getElementById('save-status');
    if (dot && status) {
      dot.style.background = '#1D9E75';
      status.textContent = '已儲存 ' + new Date().toLocaleTimeString('zh-TW', {hour:'2-digit',minute:'2-digit'});
    }
  } catch(e) { console.warn('儲存失敗', e); }
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    // 版本不符 → HTML 內建資料較新，捨棄舊暫存並以新版覆蓋
    if (data.v !== DATA_VERSION) {
      localStorage.removeItem(STORAGE_KEY);
      saveData();
      return false;
    }
    if (data.state) {
      Object.keys(data.state).forEach(cid => {
        if (state[cid]) {
          state[cid] = data.state[cid];
        }
      });
    }
    if (data.budget) budget = data.budget;
    if (data.pending) pending = data.pending;
    if (data.active) active = data.active;
    return true;
  } catch(e) {
    console.warn('載入失敗，使用預設資料', e);
    return false;
  }
}

// Patch all mutation functions to auto-save after each change
const _addAct = addAct;
addAct = function(cid, di) { _addAct(cid, di); saveData(); };

const _delAct = delAct;
delAct = function(cid, di, ai) { _delAct(cid, di, ai); saveData(); };

const _upTime = upTime;
upTime = function(cid, di, ai, v) { _upTime(cid, di, ai, v); saveData(); };

const _addPending = addPending;
addPending = function() { _addPending(); saveData(); };

const _delPending = delPending;
delPending = function(i) { _delPending(i); saveData(); };

const _addExp = addExp;
addExp = function() { _addExp(); saveData(); };

const _delExp = delExp;
delExp = function(i) { _delExp(i); saveData(); };

// Patch sw (tab switch) to save active tab
const _sw = sw;

// ── 匯出下載 ──────────────────────────────────────────────────
function exportHTML() {
  // Get the original HTML source
  const originalHTML = document.documentElement.outerHTML;

  // Serialize current live data
  const exportState = JSON.stringify(state);
  const exportBudget = JSON.stringify(budget);
  const exportPending = JSON.stringify(pending);

  // Replace the default data declarations in the source with current live data
  let newHTML = originalHTML;

  // Replace state declaration
  newHTML = newHTML.replace(
    /const state=\{[\s\S]*?\};\s*let budget=/,
    `const state=${exportState};\nlet budget=`
  );

  // Replace budget declaration
  newHTML = newHTML.replace(
    /let budget=\{[\s\S]*?\};\s*let pending=/,
    `let budget=${exportBudget};\nlet pending=`
  );

  // Replace pending declaration
  newHTML = newHTML.replace(
    /let pending=\[[\s\S]*?\];\s*let active=/,
    `let pending=${exportPending};\nlet active=`
  );

  const now = new Date();
  const stamp = now.getFullYear()+''+String(now.getMonth()+1).padStart(2,'0')+''+String(now.getDate()).padStart(2,'0');
  const filename = 'europe_trip_'+stamp+'.html';

  // Try Blob download first
  try {
    const blob = new Blob([newHTML], {type:'text/html;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  } catch(e) {
    // Fallback: open new tab, user presses Cmd/Ctrl+S
    const win = window.open('','_blank');
    if (win) {
      win.document.open();
      win.document.write(newHTML);
      win.document.close();
      setTimeout(()=>{
        win.alert('請按 Cmd+S（Mac）或 Ctrl+S（Windows）\n將頁面存成：'+filename);
      }, 600);
    } else {
      alert('請允許此網站開啟彈出視窗，或複製以下內容手動存檔。');
    }
  }

  const status = document.getElementById('save-status');
  if (status) status.textContent = '已匯出 '+now.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
}
